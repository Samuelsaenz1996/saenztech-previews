<script>(function(){var d=document.querySelector('.sk-deck');if(!d||document.documentElement.classList.contains('shot'))return;var cs=[].slice.call(d.querySelectorAll('.sk-card'));if(cs.length<2)return;var n=cs.length;setInterval(function(){cs.forEach(function(c){var i=+c.style.getPropertyValue('--i');c.style.setProperty('--i',(i+n-1)%n)});d.classList.add('spin')},3200)})();</script>
