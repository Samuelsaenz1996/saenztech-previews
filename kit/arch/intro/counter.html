<div class="intro ix-ct" aria-hidden="true" data-dur="1700" data-out="1000"><div class="ct-top">{{ b.business }}</div><div class="ct-num">0</div><div class="ct-bar"><i></i></div><div class="ct-sub">{{ A(b.subtitle) }}</div></div>
<script>(function(){var n=document.querySelector('.ct-num');if(!n)return;var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/1400);n.textContent=Math.round((1-Math.pow(1-k,3))*100);if(k<1)requestAnimationFrame(f)})(t0)})();</script>
