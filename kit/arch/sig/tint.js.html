<script>(function(){var s=document.querySelector('.sg-tint');if(!s)return;var bs=[].slice.call(s.querySelectorAll('.tn-btns button')),lv=s.querySelector('.tn-v'),i=2,auto=true;function set(v){s.style.setProperty('--dark',((100-v)/100*.92).toFixed(2));lv.textContent=v+'%';bs.forEach(function(b){b.classList.toggle('on',+b.dataset.v===v)})}
bs.forEach(function(b){b.addEventListener('click',function(){auto=false;set(+b.dataset.v)})});set(35);if(!document.documentElement.classList.contains('shot'))setInterval(function(){if(!auto)return;i=(i+1)%bs.length;set(+bs[i].dataset.v)},1800)})();</script>
