{% include "arch/sig/_sigjs.html" %}<script>(function(){var s=document.querySelector('.sg-tile');if(!s)return;var t=[].slice.call(s.querySelectorAll('.ti-grid i'));var ord=t.map(function(e,i){return [(+e.style.getPropertyValue('--r'))+(+e.style.getPropertyValue('--c')),e]}).sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]});sigOn(s,function(v){var n=Math.round(Math.min(1,v*1.3)*ord.length);ord.forEach(function(e,i){e.classList.toggle('on',i<n)})})})();</script>
