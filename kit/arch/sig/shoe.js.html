{% include "arch/sig/_sigjs.html" %}<script>(function(){var s=document.querySelector('.sg-shoe');if(!s)return;var st=s.querySelector('.sh-st'),nd=s.querySelector('.sh-needle'),full=st.getTotalLength();
sigOn(s,function(v){var d=full*Math.min(1,v*1.2),a=[];for(var x=0;x+12<=d;x+=12)a.push(6,6);a.push(0,full+20);st.style.strokeDasharray=a.join(' ');
 var pt=st.getPointAtLength(d);nd.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+') rotate('+(Math.sin(v*80)*10).toFixed(1)+')')})})();</script>
