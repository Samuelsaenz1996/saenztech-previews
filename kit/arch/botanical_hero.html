<section class="bo wrap">
 <svg class="bo-vine" viewBox="0 0 400 700" preserveAspectRatio="none" aria-hidden="true">
  <path class="vn" pathLength="1" d="M360 700 C 300 600, 390 520, 320 430 S 240 300, 300 200 S 380 80, 320 0"/>
  {% for lf in [[328,560,-40],[352,470,30],[300,390,-60],[290,300,20],[330,215,-35],[355,130,40],[330,60,-20]] %}<path class="lf" style="--d:{{ 0.5 + loop.index0 * 0.18 }}s" d="M{{ lf[0] }} {{ lf[1] }} q 22 -18 44 0 q -22 18 -44 0z" transform="rotate({{ lf[2] }} {{ lf[0] }} {{ lf[1] }})"/>{% endfor %}
 </svg>
 <div class="bo-t">
  <span class="bo-tag">{{ L(b.subtitle) }}</span>
  <h1 class="bo-h">{{ L(b.headline) }}</h1>
  <p class="lead">{{ L(b.lead) }}</p>
  <div class="ctas">{{ primary_btn() }}<a class="btn ghost" href="{{ root }}{{ items_page.dir }}/">{{ L(items_page.label) }}{{ icon('arrow') }}</a></div>
  {% if b.service_area %}<p class="bo-area">{{ icon('area') }} {{ L(b.service_area) }}</p>{% endif %}
 </div>
 <div class="bo-pic"><div class="bo-arch">{{ heroimg() }}</div>{% if b.rating %}<div class="bo-seal"><b>{{ b.rating.value }}</b><small>★ {{ b.rating.source }}</small></div>{% endif %}</div>
</section>
